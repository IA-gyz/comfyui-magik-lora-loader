name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile __init__.py nodes.py tests/test_nodes.py
      - name: Check JS syntax
        run: node --check web/js/magik_lora_loader.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
